<!DOCTYPE html>
<html>
  <body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#ffffff; padding:24px; color:#0f172a;">
    <div style="max-width:480px; margin:0 auto;">
      <h2 style="margin:0 0 12px 0;">Reset your password</h2>
      <p style="margin:0 0 16px 0; color:#475569;">
        Use the verification code below to reset your password. This code expires shortly.
      </p>
      <div style="font-size:32px; font-weight:700; letter-spacing:8px; background:#f1f5f9; padding:16px 24px; text-align:center; border-radius:8px; margin:16px 0;">
        {{ .Token }}
      </div>
      <p style="margin:16px 0 0 0; color:#64748b; font-size:13px;">
        If you didn't request this, you can safely ignore this email.
      </p>
    </div>
  </body>
</html>
